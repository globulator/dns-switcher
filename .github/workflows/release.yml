name: Release DNS Switcher (Linux & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gnome:
    name: Build GNOME Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package GNOME Extension
        run: |
          chmod +x pack_gnome_extension.sh
          ./pack_gnome_extension.sh

      - name: Upload GNOME Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-switcher-gnome
          path: dist/dns-switcher@mcperchik.zip

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Executable
        run: |
          python ui/tray/build_exe.py

      - name: Package Windows ZIP
        shell: bash
        run: |
          cd dist
          7z a -tzip DNS-Switcher-Windows.zip DNS-Switcher.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-switcher-windows
          path: dist/DNS-Switcher.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-gnome, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GNOME Artifact
        uses: actions/download-artifact@v4
        with:
          name: dns-switcher-gnome
          path: release/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: dns-switcher-windows
          path: release/

      - name: Package Release
        run: |
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/dns-switcher@mcperchik.zip
            release/DNS-Switcher.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
